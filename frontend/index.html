<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hotel Reservation System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Hotel Reservation</h1>

  <form id="reservationForm">
    <input type="text" id="guestName" placeholder="Guest Name" required />
    <input type="number" id="roomNumber" placeholder="Room Number" required />
    <input type="text" id="contactNumber" placeholder="Contact Number" required />
    <button type="submit">Reserve Room</button>
  </form>

  <h2>Reservations</h2>
  <button onclick="getReservations()">View All Reservations</button>
  <div id="reservationList"></div>

  <script src="script.js"></script>
</body>
</html>
